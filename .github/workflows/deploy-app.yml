# Pipeline 2 (Paso 6): despliegue manual de la aplicación en EC2
name: Deploy App to EC2

on:
  workflow_dispatch:

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH a EC2, hacer git pull y levantar la app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROJECT_DIR }}
            git pull origin main
            docker compose pull app || echo "Imagen no disponible; se construye localmente"
            docker compose up -d app
            docker compose ps
