# Pipeline 3 (Paso 7): despliegue de Prometheus y Grafana al cambiar monitoring/
name: Deploy Monitoring to EC2

on:
  push:
    branches: [main]
    paths:
      - 'monitoring/**'
  workflow_dispatch:

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH a EC2, hacer git pull y desplegar monitoreo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROJECT_DIR }}
            git pull origin main
            docker compose up -d --force-recreate prometheus grafana
            docker compose ps
