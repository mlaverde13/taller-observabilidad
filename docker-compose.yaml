services:
  # Aplicación Flask que expone métricas en /metrics
  app:
    image: ${APP_IMAGE:-observabilidad-app:latest}
    build: ./app
    container_name: flask-app
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - observabilidad

  # Prometheus: recolecta las métricas de la app cada 5 segundos
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - observabilidad

  # Grafana: visualización de las métricas desde el navegador
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - observabilidad

networks:
  observabilidad:

volumes:
  grafana-data:
